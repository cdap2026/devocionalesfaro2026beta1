l dolor de haber entristecido a un Padre que nos ama, y la decisión de dar la vuelta y caminar en otra dirección.

Pedro añade algo que nos quita el miedo: Dios es paciente con nosotros porque no quiere que nadie se pierda. Ese tiempo que a veces sentimos que se alarga no es indiferencia de Dios; es misericordia esperando que volvamos. Arrepentirse no es castigarse ni humillarse delante de los demás: es dejar de esconderse delante de Dios. Hoy, antes de que el día avance, nombra con claridad aquello de lo que necesitas volver, y da el primer paso de regreso.`,oracion:"Padre, hoy dejo de esconderme. Muéstrame con claridad lo que tengo que soltar y dame el valor de volver a Ti sin excusas ni justificaciones. Gracias porque tu paciencia conmigo no es permiso para seguir igual, sino tiempo de gracia para volver. Cambia mi tristeza por arrepentimiento verdadero, y mi arrepentimiento por caminos nuevos. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/e40b838b-292e-454b-96ea-b4fa9590a755.jpg",imagenCredito:"Foto: Valiphotos / Pixabay",id:"dev-2026-11-01",planId:"plan-2026-11"},{dia:2,tematica:"El amor inquebrantable de Dios",at:"Oseas 11:1-4",nt:"Juan 3:16; Romanos 5:8",alabanza:{titulo:"Cuán grande es Él",nota:"Para responder con asombro al amor de un Padre que no cambia."},reflexion:`Dios describe su amor como el de un padre que enseña a caminar a su hijo: lo levanta por los brazos, lo sostiene cerca de su rostro, se inclina para darle de comer. No es un amor que espera a que el hijo se porte bien para abrazarlo; es un amor que se agacha cuando el hijo todavía no sabe sostenerse solo.

Aunque el pueblo se alejó, el corazón de Dios no cambió de dirección. Y Juan 3:16 dice lo mismo con otras palabras: la entrega del Hijo no es la reacción de un Dios ofendido, es la prueba de un amor que decidió antes de que lo mereciéramos. Romanos añade que Cristo murió por nosotros cuando todavía éramos pecadores. Cuando sientas que tienes que ganarte a Dios, vuelve a este texto: ya fuiste buscado. Su amor no depende de tu desempeño de hoy, sino de su carácter.`,oracion:"Señor, gracias porque tu amor no cambia cuando yo fallo. Enséñame a descansar en él en lugar de intentar merecerlo, y a amar a otros con esa misma paciencia que no se rinde. Quita de mí el miedo de ser rechazado y pon en su lugar la confianza de un hijo. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/76f38643-c0d6-4fb4-ab18-a75adf8278a2.jpg",imagenCredito:"Foto: geralt / Pixabay",id:"dev-2026-11-02",planId:"plan-2026-11"},{dia:3,tematica:"Justicia verdadera",at:"Amós 5:24",nt:"Mateo 23:23; Santiago 1:27",alabanza:{titulo:"Danos un corazón",nota:"Un canto para pedirle a Dios un corazón sensible a la justicia y a quienes sufren."},reflexion:`La justicia que Dios pide no corre solamente en los tribunales: corre como un río, dice Amós, como un torrente que nunca se seca. Es decir, debe ser constante, abundante y visible en la vida diaria: en la manera en que pagas lo que debes, en cómo hablas de tu hermano, en a quién defiendes cuando no puede defenderse solo.

Jesús fue directo con los que eran exactos en lo pequeño y descuidados en lo grande: diezmaban la menta y olvidaban el juicio, la misericordia y la fe. Santiago nos da el retrato práctico: visitar al huérfano y a la viuda en sus tribulaciones, y guardarse del mundo. La verdadera justicia se mide en cómo tratas a quien no te puede devolver el favor. Hoy vale preguntarte: ¿por dónde corre el río en tu vida? ¿O se quedó en el discurso y no llegó nunca a tus manos?`,oracion:"Dios de justicia, no permitas que mi fe se quede en palabras correctas. Haz que mi trato con la gente refleje tu corazón: que defienda al que no tiene voz, que sea honesto cuando nadie me mira y que mi casa conozca tu misericordia antes que mi discurso. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/91754ec4-33e4-4621-8a81-05e35c2e593b.jpg",imagenCredito:"Foto: kissearth / Pixabay",id:"dev-2026-11-03",planId:"plan-2026-11"},{dia:4,tematica:"El día del Señor",at:"Joel 2:28-32",nt:"Hechos 2:17-21; Apocalipsis 6",alabanza:{titulo:"Rey de reyes",nota:"Para esperar con la mirada puesta en el Rey que viene y cuyo reino no tendrá fin."},reflexion:`El día del Señor es el momento en que Dios pone todas las cosas en su lugar. Joel lo anunció con imágenes grandes: Espíritu derramado sobre toda carne y señales en los cielos. Pedro, en Pentecostés, dijo que ese día ya había comenzado: los hijos e hijas profetizan, los jóvenes ven visiones, los ancianos sueñan.

Eso significa que hoy vivimos entre el anuncio y la consumación: el Espíritu ya fue derramado, pero el mundo todavía gime. Y en el centro de ese día no está el miedo, sino una promesa: todo aquel que invoque el nombre del Señor será salvo. No sabemos la hora ni el calendario, pero sí sabemos el nombre. Vivir despiertos no es vivir asustados; es vivir con el corazón puesto en Aquel que viene y las manos ocupadas en lo que Él nos dejó hacer.`,oracion:"Señor de la historia, tú tienes la última palabra sobre todo lo que hoy parece desordenado. Ayúdame a vivir despierto, con el corazón puesto en tu venida y las manos ocupadas en tu obra. Llena mi vida de tu Espíritu para que mi testimonio sea claro en los días que corren. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/e82ef070-6510-471f-ab49-fb2e1ec0ad0d.jpg",imagenCredito:"Foto: Sven_fotografiert / Pixabay",id:"dev-2026-11-04",planId:"plan-2026-11"},{dia:5,tematica:"Restauración y esperanza",at:"Abdías 1:17-21",nt:"Mateo 25:31-46; Apocalipsis 21",alabanza:{titulo:"Restaura mi corazón",nota:"Una oración cantada para que Dios reconstruya lo que está en ruinas."},reflexion:`La restauración que Dios promete no es un remiendo: es una casa nueva. Abdías anuncia que habrá un remanente que subirá al monte de Sion, y Apocalipsis termina mostrándonos el final de la historia: un cielo nuevo, una tierra nueva, y Dios enjugando cada lágrima.

Entre esas dos escenas está Jesús, enseñando que lo que hacemos al hambriento, al sediento, al enfermo y al preso lo hacemos a Él. La esperanza bíblica nunca es pasiva: mira el final y por eso sirve en el presente. Si hoy estás en ruinas, recuerda que el que reconstruye no abandona la obra de sus manos. Lo que hoy parece pérdida total puede ser el terreno donde Él empieza a edificar algo que permanezca.`,oracion:"Padre, tú eres el que levanta lo que está caído. Hoy te entrego mis ruinas y te pido que hagas en mí lo que solo tú puedes hacer. Dame esperanza activa: manos dispuestas a servir mientras espero tu restauración completa. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/3fe68f12-1f4d-4ec2-8c7b-d054f98de617.jpg",imagenCredito:"Foto: Myriams-Fotos / Pixabay",id:"dev-2026-11-05",planId:"plan-2026-11"},{dia:6,tematica:"Dios es soberano",at:"Jonás 2:1-10",nt:"Romanos 9:15-18; Efesios 1:11",alabanza:{titulo:"Tuya es la gloria",nota:"Para descansar en la soberanía de un Dios que tiene el control de la historia."},reflexion:`Jonás quiso huir del propósito de Dios y terminó orando desde el vientre de un pez. Y aun en ese lugar, la soberanía de Dios no fue una amenaza: fue su salvación. «La salvación es de Jehová», escribió desde el fondo. Es la lección que necesitaba aprender, y la que necesitamos hoy.

Pablo va más profundo: Dios tiene misericordia de quien Él quiere tener misericordia, y su plan no fracasa por la terquedad humana. Efesios lo dice con claridad: Él obra todas las cosas conforme al designio de su voluntad. Esto no nos convierte en marionetas; nos convierte en gente descansada. Si Dios tiene las riendas, deja de cargar con un peso que nunca fue tuyo. Obedece, ora, trabaja y ama; pero suelta el resultado en sus manos.`,oracion:"Dios soberano, tú tienes las riendas de lo que yo no puedo controlar. Perdóname por querer dirigir lo que solo te corresponde y enséñame a obedecer sin exigir garantías. Descansa mi corazón en tu gobierno y ordena mis pasos según tu voluntad. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/b0b88d12-cc16-4fca-8a8a-a714702d278f.jpg",imagenCredito:"Foto: florianhoellmueller / Pixabay",id:"dev-2026-11-06",planId:"plan-2026-11"},{dia:7,tematica:"Lo que Dios requiere de ti",at:"Miqueas 6:6-8",nt:"Mateo 22:37-40; Santiago 2:8",alabanza:{titulo:"Más cerca, oh Dios, de ti",nota:"Para pedir que caminemos con humildad cada día."},reflexion:`El pueblo preguntó qué podía dar para pagar su deuda: holocaustos, ríos de aceite, incluso su primogénito. Dios respondió que lo que pide no es un pago, es una vida: hacer justicia, amar misericordia y caminar humildemente con Él.

Estas tres cosas ordenan todo el resto de la ley, como dijo Jesús: amar a Dios y amar al prójimo. La justicia sin misericordia se vuelve dureza; la misericordia sin justicia se vuelve complicidad; y ambas sin humildad se vuelven espectáculo. Fíjate que el centro de todo no es una ofrenda extraordinaria, sino una fidelidad diaria. Lo que Dios espera de ti hoy probablemente no sea heroico: es hacer lo correcto con la persona que tienes al lado.`,oracion:"Señor, enséñame a hacer justicia sin dureza, a amar con misericordia sin complicidad y a caminar contigo sin orgullo. Que mi vida entera sea la ofrenda que te agrada. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/3090a766-f726-4d89-84af-9c6040fc6c99.jpg",imagenCredito:"Foto: Pexels / Pixabay",id:"dev-2026-11-07",planId:"plan-2026-11"},{dia:8,tematica:"El Mesías rey y juez",at:"Miqueas 5:2",nt:"Mateo 2:6; Juan 1:49",alabanza:{titulo:"Digno eres",nota:"Para adorar al Rey nacido en Belén, digno de recibir toda gloria y honra."},reflexion:`Miqueas anunció que de Belén, una aldea pequeña y sin importancia, saldría el gobernante de Israel, cuyas salidas son desde la eternidad. La grandeza de Dios casi siempre nace en lugares pequeños: un pesebre, una aldea, una familia sin recursos, un taller de carpintero.

Natanael lo confesó sin rodeos: «Rabí, tú eres el Hijo de Dios, tú eres el Rey de Israel». Ese rey que nació en lo escondido es el mismo que juzgará con justicia y reinará para siempre. Su reino no se impone por fuerza: se recibe por fe. Y su trono no está lejos de ti; está en el lugar donde decides rendirte a Él. Vale la pena preguntarse hoy: ¿qué área de mi vida sigue esperando su reinado?`,oracion:"Rey de reyes, tú viniste pequeño y eterno a la vez. Reina hoy en lo que todavía te estoy escondiendo. Que mi confesión no sea solo de palabras, sino de una vida rendida a ti. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/683a55dc-53d7-4614-a10d-9b638a349795.jpg",imagenCredito:"Foto: rauschenberger / Pixabay",id:"dev-2026-11-08",planId:"plan-2026-11"},{dia:9,tematica:"Llamado a la santidad",at:"Nahúm 1:2-8",nt:"1 Pedro 1:15-16; Hebreos 12:14",alabanza:{titulo:"Santo, santo, santo",nota:"Un himno clásico para recordar que nuestro Dios es completamente santo."},reflexion:`Nahúm describe a Dios como fortaleza en el día de la angustia, pero también como el que no deja al culpable sin castigo. Es el equilibrio que perdemos con facilidad: un Dios que consuela sin exigir nada, o un Dios que exige sin consolar. La Biblia sostiene las dos manos a la vez: Él es fuego, y es refugio.

Por eso Pedro nos llama a una santidad concreta: sed santos en toda vuestra manera de vivir. La santidad no es una lista de prohibiciones ni una vitrina para que otros nos admiren; es apartarse para Dios en lo cotidiano: lo que miro, lo que digo, cómo trato a mi familia, cómo manejo mi dinero. Sin santidad, dice Hebreos, nadie verá al Señor. No es un extra para religiosos avanzados: es el camino normal de quien ha sido rescatado.`,oracion:"Dios santo, no quiero una fe de apariencias. Aparta mi vida para ti en las decisiones pequeñas y en las grandes. Muéstrame hoy lo que debo dejar y dame fuerza para dejarlo. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/7acfef04-fa3f-4817-bc1d-f37f768ac480.jpg",imagenCredito:"Foto: FMedic_photography / Pixabay",id:"dev-2026-11-09",planId:"plan-2026-11"},{dia:10,tematica:"La fidelidad de Dios",at:"Habacuc 2:4",nt:"Romanos 1:17; Gálatas 3:11",alabanza:{titulo:"Grande es tu fidelidad",nota:"Para recordar que sus misericordias son nuevas cada mañana."},reflexion:`Habacuc se atrevió a preguntarle a Dios por qué toleraba la injusticia. Y Dios no lo ignoró: le respondió, aunque le pidió esperar. «El justo por su fe vivirá», le dijo. No por sus respuestas completas, no por sus circunstancias resueltas, sino por su fe en Aquel que sí es fiel.

Pablo tomó esa frase y la convirtió en el corazón del evangelio: la justicia de Dios se revela por la fe, de fe en fe. La fidelidad de Dios no está en que todo salga como esperamos, sino en que Él no cambia de carácter mientras esperamos. Su silencio no es ausencia; muchas veces es la sala de espera donde madura la fe. Hoy vale preguntarte: ¿puedes confiar en su carácter aunque no entiendas su calendario?`,oracion:"Señor, tú no cambias aunque mis circunstancias cambien. Enséñame a vivir por fe y no por lo que veo, a sostener tu promesa mientras espero tu respuesta. Renueva mi confianza en tu carácter. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/20270449-e53e-4210-98cf-e65a7f406451.jpg",imagenCredito:"Foto: HỒNG_HOÀNG_SƠN / Pixabay",id:"dev-2026-11-10",planId:"plan-2026-11"},{dia:11,tematica:"La restauración futura",at:"Sofonías 3:14-17",nt:"Lucas 1:46-55; Apocalipsis 21:4",alabanza:{titulo:"Cantaré de tu amor por siempre",nota:"Inspirado en el Salmo 89, para cantarle al Dios que canta sobre nosotros."},reflexion:`Sofonías promete que Dios se alegrará sobre su pueblo con gritos de júbilo: un Dios que canta sobre los que ama. Esa imagen debería detenernos. El que juzga también festeja la restauración de los suyos, y en medio de la fiesta «callará de amor»: ya no habrá reproche que dar.

María cantó ese futuro en pasado, como si ya hubiera ocurrido: derribó a los poderosos, enalteció a los humildes, llenó de bienes a los hambrientos. Y Apocalipsis nos da el desenlace: lágrimas enjugadas, muerte vencida, dolores terminados. La restauración futura no es una manera de escapar del presente: es el motivo por el que hoy se puede seguir sembrando en tierra dura. Lo que hoy cuesta, mañana será testimonio.`,oracion:"Dios que canta sobre los suyos, alegra mi corazón con la certeza de tu restauración. Sostén mi fe cuando el presente pesa y ayúdame a servir con la esperanza puesta en tu promesa. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/90c8dcd3-4055-4725-aeef-09e15dcfeb1f.jpg",imagenCredito:"Foto: 김경복 / Pixabay",id:"dev-2026-11-11",planId:"plan-2026-11"},{dia:12,tematica:"El poder de Dios en nuestra debilidad",at:"Hageo 2:6-9",nt:"2 Corintios 12:9; Filipenses 4:13",alabanza:{titulo:"Poderoso Dios",nota:"Para confiar en su poder justo donde el nuestro se acaba."},reflexion:`Dios prometió que llenaría de gloria su casa, aunque los que habían visto el primer templo lloraban porque el nuevo parecía menos. Su respuesta fue contundente: la gloria verdadera no está en el tamaño de la obra, sino en la presencia del que la habita.

Y en el Nuevo Testamento aprendemos dónde se perfecciona ese poder: en la debilidad. «Mi poder se perfecciona en la debilidad», le dijo el Señor a Pablo. Es una lógica que el mundo no entiende y que el evangelio convierte en camino: allí donde ya no puedes, Dios sí puede. Por eso Pablo puede decir «todo lo puedo en Cristo que me fortalece» sin falsa autoestima. Su fuerza no es tu capacidad mejorada; es su presencia sosteniéndote. Hoy, en lugar de esconder tu debilidad, ponla en sus manos.`,oracion:"Señor, tu poder no depende de mi fuerza. Hoy te presento lo que no puedo resolver con mis propios recursos y te pido que obres donde yo ya no llego. Y cuando no vea salida, enséñame a descansar confiado en ti. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/394aa868-e4fb-440b-a9e8-15c8707141ef.jpg",imagenCredito:"Foto: Ralphs_Fotos / Pixabay",id:"dev-2026-11-12",planId:"plan-2026-11"},{dia:13,tematica:"El Espíritu Santo prometido",at:"Zacarías 12:10",nt:"Juan 19:34; Hechos 2:1-4",alabanza:{titulo:"Ven, Espíritu Santo",nota:"Una invitación sencilla para que el Espíritu llene nuestra vida."},reflexion:`Zacarías prometió que Dios derramaría espíritu de gracia y de súplica, y que mirarían al que traspasaron. Juan vio esa promesa cumplirse en la cruz: agua y sangre saliendo del costado abierto de Jesús. La gracia no es un concepto abstracto; es un costado traspasado por amor.

En Pentecostés el Espíritu vino con viento y fuego sobre los que estaban orando juntos, y los llenó. Ese mismo Espíritu es el que hoy convence, consuela, guía y capacita. No es un premio para espirituales avanzados: es la promesa del Padre para todos los que se arrepienten y creen. Pero hay una condición que no podemos saltarnos: el Espíritu se recibe, se pide y se sigue. ¿Le estás dando espacio en tus días, o lo tienes guardado solo como doctrina?`,oracion:"Padre, derrama tu Espíritu sobre mi vida como lo prometiste. Convence mi corazón, ilumina tu Palabra y capacítame para dar testimonio. No quiero vivir de las experiencias que otros me cuentan, sino de tu presencia conmigo. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/2c269cea-03ce-4eaf-bec2-eb6bd8535a60.jpg",imagenCredito:"Foto: geralt / Pixabay",id:"dev-2026-11-13",planId:"plan-2026-11"},{dia:14,tematica:"La obra redentora de Dios",at:"Malaquías 3:1-3",nt:"Mateo 11:10; Lucas 7:27",alabanza:{titulo:"En el monte Calvario",nota:"Para contemplar la cruz, donde fuimos redimidos."},reflexion:`Malaquías anunció un mensajero que prepararía el camino, y luego la llegada del Señor a su templo: un refinador que se sienta a purificar plata. El fuego no destruye la plata; la limpia. Lo que hace es separar lo que no pertenece.

Jesús identificó a Juan el Bautista como ese mensajero, y a sí mismo como el que venía después. La obra redentora no es solamente un pago legal por el pecado: es también un proceso de limpieza en la vida del que cree. A veces Dios permite el calor de una prueba no para castigarte, sino para quitarte lo que te hace daño. Si estás en esa temporada, recuerda: el refinador está sentado, controlando el fuego, sin quitar los ojos de ti.`,oracion:"Señor, gracias porque no me dejas como estoy. Si hoy estoy en el fuego de una prueba, ayúdame a ver tu mano de refinador y no la de un verdugo. Limpia lo que no te pertenece y haz que salga plata. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/78815143-023e-4f7e-b9fa-678fde52b036.jpg",imagenCredito:"Foto: geralt / Pixabay",id:"dev-2026-11-14",planId:"plan-2026-11"},{dia:15,tematica:"Dios purifica a su pueblo",at:"Malaquías 3:2-4",nt:"1 Juan 1:7; Hebreos 10:22",alabanza:{titulo:"Más blanco que la nieve",nota:"Inspirado en el Salmo 51:7, para pedir limpieza y acercarnos con sinceridad."},reflexion:`El mismo profeta que anunció al refinador preguntó: «¿y quién podrá soportar el tiempo de su venida?». La purificación es buena, pero no es cómoda. Nadie disfruta el limpieza de una herida, aunque la cure.

Juan escribe que la sangre de Jesús limpia de todo pecado, y Hebreos dice que podemos acercarnos con corazón sincero, purificados y lavados. La diferencia entre un pueblo purificado y uno simplemente religioso está en esto: el primero se acerca a la luz aunque la luz revele cosas incómodas; el segundo las esconde. La purificación empieza cuando dejamos de usar máscaras delante de Dios. Hoy puedes acercarte, no porque estés limpio, sino para ser limpiado.`,oracion:"Jesús, tu sangre limpia y tu luz expone. Prefiero el dolor de ser limpiado a la comodidad de seguir escondido. Lávame a fondo, también en lo que creo que nadie ve. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/a7605d31-a441-4b41-b5da-920f9a4adff3.jpg",imagenCredito:"Foto: suhasrawool / Pixabay",id:"dev-2026-11-15",planId:"plan-2026-11"},{dia:16,tematica:"Misericordia y justicia",at:"Oseas 14:1-4",nt:"Lucas 15:11-32; Mateo 5:6",alabanza:{titulo:"Como el ciervo",nota:"Para expresar nuestra sed de Dios."},reflexion:`El hijo pródigo practicó su discurso mientras volvía, ensayando palabras de siervo. El padre no lo escuchó completo: corrió, lo abrazó y ordenó vestido, anillo y fiesta. La misericordia de Dios casi siempre interrumpe nuestros discursos.

Pero la parábola tiene también otro hijo: el que se quedó y se enojó porque el derrochador fue recibido. Es posible haber servido toda la vida y vivir con el corazón calculando deudas ajenas. Jesús llama bienaventurados a los que tienen hambre y sed de justicia, porque esa sed incluye el deseo de que la misericordia triunfe. La pregunta de hoy no es solo si has pecado; es si te ofende la gracia que otros reciben.`,oracion:"Padre, gracias porque me sales al encuentro antes de que termine mi disculpa. Límpiame del enojo contra tu bondad y enséñame a desear la restauración de otros como deseo la mía. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/b5e197f0-4cb8-403e-9bc3-194ab61baf91.jpg",imagenCredito:"Foto: Myriams-Fotos / Pixabay",id:"dev-2026-11-16",planId:"plan-2026-11"},{dia:17,tematica:"El corazón arrepentido",at:"Joel 2:12-13",nt:"2 Corintios 7:10; Salmo 51",alabanza:{titulo:"Renuévame",nota:"Para pedirle a Dios un corazón limpio y un espíritu nuevo."},reflexion:`Joel dice que podemos rasgar el corazón y no las vestiduras. David lo entendió después de su peor caída: «los sacrificios de Dios son el espíritu quebrantado; al corazón contrito y humillado no despreciarás». El que había escrito tantos salmos cayó, y en su oración no intentó negociar, ni gestionar su imagen, ni justificarse.

Pablo distingue dos tristezas: la del mundo, que mata, y la que conduce a la salvación. Una se enfoca en las consecuencias; la otra, en haber ofendido a un amor que no merecía esa ofensa. Un corazón verdaderamente arrepentido no promete con emoción: obedece en lo concreto. Recuerda la petición de David: no pidió que su reino siguiera igual, pidió «crea en mí, oh Dios, un corazón limpio».`,oracion:"Dios, al corazón contrito no desprecias. Te entrego el mío sin adornos y sin excusas. Crea en mí un corazón limpio y renueva un espíritu fiel en mi interior. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/eae627b5-2531-4195-be60-7279343e17ff.jpg",imagenCredito:"Foto: voltamax / Pixabay",id:"dev-2026-11-17",planId:"plan-2026-11"},{dia:18,tematica:"El Mesías, luz para las naciones",at:"Malaquías 4:2",nt:"Juan 8:12; Mateo 4:16",alabanza:{titulo:"Luz del mundo",nota:"Para seguir de cerca a Jesús, la luz que alumbra nuestra oscuridad."},reflexion:`Malaquías termina su profecía con una imagen preciosa: para los que temen su nombre, el sol de justicia nacerá con salvación en sus alas. Es la última página del Antiguo Testamento, y es un amanecer.

Jesús toma esa imagen y se la aplica a sí mismo: «Yo soy la luz del mundo; el que me sigue no andará en tinieblas». Mateo, citando a Isaías, dice que el pueblo que andaba en tinieblas vio una gran luz. Esa luz no se instala en el templo; sale al encuentro de la gente donde vive, en Galilea, tierra de los gentiles. Por eso es luz para las naciones. Y una luz no discute con las tinieblas: simplemente brilla. Hoy no se te pide mucho ruido, se te pide seguir la luz de cerca.`,oracion:"Jesús, luz del mundo, no quiero caminar a tientas. Sigo tus pasos hoy, también en lo que no entiendo. Haz de mi vida un reflejo humilde de tu luz para los que están en tinieblas. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/ba964ef7-0cef-4c6d-99a4-62be903976ec.jpg",imagenCredito:"Foto: Kanenori / Pixabay",id:"dev-2026-11-18",planId:"plan-2026-11"},{dia:19,tematica:"Esperanza en la restauración",at:"Zacarías 8:3",nt:"Romanos 15:13; Efesios 1:17",alabanza:{titulo:"Mi esperanza está en ti",nota:"Para poner la mirada en el Dios de esperanza."},reflexion:`Zacarías promete que Dios volverá a Sion y habitará en medio de Jerusalén; y añade algo enternecedor: la plaza se llenará de niños y de ancianos. La restauración se reconoce en lo cotidiano: gente caminando sin miedo por sus calles, familias reunidas otra vez.

Efesios pide tener los ojos del entendimiento iluminados para conocer la esperanza a la cual fuimos llamados. Romanos va en la misma dirección: el Dios de esperanza os llene de todo gozo y paz en el creer. La esperanza bíblica no es simplemente desear que algo pase; es una persona con un nombre. Por eso abunda incluso cuando los datos no acompañan. Si hoy la plaza de tu vida está vacía, pide ojos para ver lo que Dios ya está levantando.`,oracion:"Dios de esperanza, llena mi corazón de gozo y de paz mientras creo en ti. Ilumina mi entendimiento para ver la esperanza a la que me llamaste y no quedarme mirando lo que todavía no ha llegado. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/6dda6c06-c8cf-48cb-82dc-5fcd8e6109a2.jpg",imagenCredito:"Foto: congerdesign / Pixabay",id:"dev-2026-11-19",planId:"plan-2026-11"},{dia:20,tematica:"Justicia y humildad",at:"Miqueas 6:8",nt:"Santiago 4:6; Mateo 5:3",alabanza:{titulo:"Todo a Cristo yo me rindo",nota:"Un himno para rendir el orgullo y caminar con humildad."},reflexion:`Dios ya dijo qué es lo que espera: hacer justicia, amar misericordia y caminar humildemente con Él. No hay un misterio por resolver, hay una obediencia por ejercer.

Santiago es claro: Dios resiste a los soberbios y da gracia a los humildes. Y Jesús comienza su sermón con una bienaventuranza incómoda: bienaventurados los pobres en espíritu. La humildad no es pensar poco de ti mismo; es dejar de tenerte como centro. El humilde puede ser corregido sin romperse, sirve sin llevar la cuenta y celebra el bien de otros. Esa es la única manera en que la justicia no se vuelve crueldad. Hoy el paso quizá sea pequeño: pedir perdón, escuchar antes de responder, reconocer algo bueno en quien te molesta.`,oracion:"Señor, enséñame a caminar humildemente contigo. Corrige mi orgullo, dame gracia para pedir perdón y valentía para defender lo justo sin violencia. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/df2724e9-40c6-4be3-8978-3dfffa886763.jpg",imagenCredito:"Foto: Antranias / Pixabay",id:"dev-2026-11-20",planId:"plan-2026-11"},{dia:21,tematica:"El poder de la Palabra de Dios",at:"Habacuc 2:2",nt:"Hebreos 4:12; Romanos 10:17",alabanza:{titulo:"Lámpara es a mis pies tu palabra",nota:"Salmo 119:105 hecho canción: su Palabra alumbra cada paso."},reflexion:`Habacuc recibió una instrucción sencilla: escribe la visión y hazla clara, para que se pueda leer. La Palabra de Dios no es para guardarse en la memoria de unos pocos; es para leerse, entenderse y vivirse.

Hebreos describe esa Palabra como viva y eficaz, más cortante que una espada de doble filo, juzgando los pensamientos e intenciones del corazón. Su poder no depende de nuestra emoción al leerla, sino de su naturaleza. Y Pablo añade el final lógico: la fe viene por el oír, y el oír por la palabra de Dios. Si quieres más fe, no busques una experiencia más intensa; vuelve al texto. Una línea leída y obedecida transforma más que diez páginas salteadas. ¿Qué te está diciendo hoy la Escritura que todavía no has cumplido?`,oracion:"Señor, tu Palabra es viva. Abre mis oídos para oír con fe y mis manos para obedecer sin demora. Que no sea solo la lectura de hoy, sino dirección para lo que sigue. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/a10b044c-0f93-4ab0-8b23-d1389a5f0a28.jpg",imagenCredito:"Foto: pedro_wroclaw / Pixabay",id:"dev-2026-11-21",planId:"plan-2026-11"},{dia:22,tematica:"La fidelidad a Dios",at:"Sofonías 2:3",nt:"1 Corintios 1:9; 2 Timoteo 2:13",alabanza:{titulo:"Decidido estoy por Cristo",nota:"Para renovar la decisión de seguirlo, también en los días sin emoción."},reflexion:`Sofonías invita a buscar a Jehová antes de que llegue el día del juicio: buscar la justicia y la mansedumbre. Es una invitación a una fidelidad tranquila y constante, no a la emoción del momento.

Pablo anima a los corintios recordándoles que Dios es fiel, y que la fidelidad de ellos descansa en la de Él. Y a Timoteo le escribe algo que quita el aliento: si somos infieles, él permanece fiel; no puede negarse a sí mismo. Nuestra fidelidad es respuesta, no moneda de cambio. No llegaremos al final por no haber fallado nunca, sino por seguir volviendo. La meta no es una vida sin tropiezos; es una vida que no abandona el camino.`,oracion:"Dios fiel, yo decido seguirte también en los días sin emoción. Cuando falle, no quiero inventar excusas: quiero volver. Sostén mi paso y hazme fiel en lo poco que hoy tengo delante. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/4017aa6e-7c93-4660-bf03-5552f8beae6c.jpg",imagenCredito:"Foto: FotoRieth / Pixabay",id:"dev-2026-11-22",planId:"plan-2026-11"},{dia:23,tematica:"La promesa del Espíritu",at:"Joel 2:28-29",nt:"Hechos 2:17; Juan 14:26",alabanza:{titulo:"Santo Espíritu",nota:"Para pedirle al Espíritu que nos enseñe y nos acompañe hoy."},reflexion:`Dios prometió derramar su Espíritu sobre toda carne: sobre hijos e hijas, sobre jóvenes y ancianos. No es un privilegio reservado a unos pocos dotados; es una promesa para el pueblo entero, y eso incluye a los que se consideran comunes y corrientes.

Jesús lo había dicho antes: el Consolador, el Espíritu Santo, os enseñará todas las cosas y os recordará todo lo que os he dicho. La palabra «consolador» no solo describe a alguien que calma el dolor, sino a alguien que se coloca al lado para ayudarte a seguir. El Espíritu no viene a darte espectáculo, viene a acompañarte. A veces se manifiesta en dones visibles; más a menudo, en una paz que no deberías tener y en una convicción que ya no puedes ignorar.`,oracion:"Espíritu de Dios, lléname y acompáñame. Enséñame todas las cosas y recuérdame la palabra de Jesús cuando más la necesito. Ayúdame también a escuchar lo que quieres decirme hoy. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/690bf7ab-f0b6-44f8-9fff-b4704ce50978.jpg",imagenCredito:"Foto: SimoneVomFeld / Pixabay",id:"dev-2026-11-23",planId:"plan-2026-11"},{dia:24,tematica:"El juicio sobre las naciones",at:"Abdías 1:15-16",nt:"Apocalipsis 19:11-21",alabanza:{titulo:"Digno es el Cordero",nota:"Para recordar que el Juez de las naciones es también el Cordero que nos rescató."},reflexion:`Abdías anuncia que el día de Jehová está cerca sobre todas las naciones: se hará conforme a lo que hicieron. No todo se arregla en esta vida, y la Escritura no finge lo contrario. El juicio de Dios es la garantía de que ninguna injusticia quedará sin respuesta.

Apocalipsis presenta a quien juzga con justicia y hace guerra: un jinete llamado Fiel y Verdadero. Es una imagen dura y, bien entendida, consoladora: el que juzga conoce cada hecho escondido, cada abuso silenciado, cada causa olvidada. Pero también nos pone delante de una pregunta personal: si el juicio de Dios es real, ¿cómo estoy tratando a los demás? Esa seriedad del juicio es justamente la razón por la que proclamamos la gracia: todavía hay tiempo de refugiarse en Cristo.`,oracion:"Señor justo, tú conoces cada injusticia y nada queda sin peso en tu balanza. Gracias porque en Cristo encontré refugio. Hazme justo en el trato con otros y valiente para anunciar tu gracia mientras todavía se puede. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/d7d77f4b-45c4-4507-a86a-099644c2f4ee.jpg",imagenCredito:"Foto: Michael_Pointner / Pixabay",id:"dev-2026-11-24",planId:"plan-2026-11"},{dia:25,tematica:"La gracia de Dios",at:"Oseas 2:14",nt:"Efesios 2:8-9; Tito 2:11",alabanza:{titulo:"Maravillosa gracia",nota:"Para agradecer una gracia que no se compra ni se merece."},reflexion:`Oseas dice que Dios atrae a su pueblo al desierto para hablarle al corazón. Parece extraño: un lugar de pérdida como escenario de ternura. Pero así es la gracia: usa el desierto que no buscamos para hablarnos como nunca nos habíamos escuchado.

Pablo lo hace doctrina: por gracia somos salvos, por medio de la fe, y no por obras, para que nadie se gloríe. Y Tito añade que la gracia de Dios se ha manifestado para salvación a todos, y que además nos enseña a vivir sobria, justa y piadosamente. La gracia no es solo la puerta de entrada y luego esfuerzos propios; es la que nos sostiene y nos instruye hasta el final. Hoy no vives para ser aceptado: vives porque ya fuiste aceptado en Cristo.`,oracion:"Señor, gracias por una gracia que no puedo comprar ni merecer. Enséñame a vivir desde tu aceptación y no hacia ella, para que mis obras sean fruto y no factura. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/4afb4e65-5666-4466-b700-a7338f40f078.jpg",imagenCredito:"Foto: fietzfotos / Pixabay",id:"dev-2026-11-25",planId:"plan-2026-11"},{dia:26,tematica:"La fidelidad de Dios a su pacto",at:"Malaquías 3:6",nt:"Hebreos 10:23; Romanos 11:29",alabanza:{titulo:"Tu fidelidad",nota:"Para recordar que Dios cumple todo lo que promete."},reflexion:`«Porque yo Jehová no cambio; por eso vosotros, hijos de Jacob, no habéis sido consumidos». Es uno de los versículos más firmes de la Biblia: la razón de nuestra continuidad no es nuestra estabilidad, es la suya.

Hebreos nos anima a mantener firme la profesión de nuestra esperanza, porque fiel es el que prometió. Y Romanos dice que los dones y el llamamiento de Dios son irrevocables. Un pacto así no se apoya en tu constancia, sino en su carácter. Podemos vivir con confianza precisamente porque Dios no está negociando su amor cada mañana según nuestro rendimiento. Si hoy sientes que ya fallaste demasiado, escucha esto: Él sigue siendo el mismo de ayer.`,oracion:"Dios de pacto, gracias porque tu fidelidad no depende de la mía. Cuando dude, sosténme; cuando caiga, levántame. Ayúdame a mantener firme mi esperanza porque tú lo prometiste. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/b8c3137d-57bd-4c0e-ba33-944e66e2e1cb.jpg",imagenCredito:"Foto: Pexels / Pixabay",id:"dev-2026-11-26",planId:"plan-2026-11"},{dia:27,tematica:"La justicia de Dios prevalece",at:"Nahúm 1:7-9",nt:"Romanos 12:19; 2 Tesalonicenses 1:6",alabanza:{titulo:"Castillo fuerte es nuestro Dios",nota:"Para refugiarnos en el Dios que es bueno y fortaleza en el día de la angustia."},reflexion:`Nahúm dice que Jehová es bueno, fortaleza en el día de la angustia, y que conoce a los que en Él confían. Lo dice un profeta que acaba de anunciar juicio sobre Nínive, la ciudad violenta. Dios no es neutral ante el abuso.

Pablo saca la conclusión práctica: no os venguéis vosotros mismos, dejad lugar a la ira de Dios, porque suya es la venganza; y añade: vence el mal con el bien. Dejar la venganza en manos de Dios no es debilidad, es fe en que Él juzga mejor que nosotros y en que nuestro corazón no está hecho para el rencor. Perdonar no es decir que no pasó nada; es soltar el derecho de cobrar.`,oracion:"Dios justo, tú ves lo que me hicieron y lo que yo he hecho. Te entrego mi derecho a cobrar venganza y te pido un corazón limpio de rencor. Confío en que tu justicia no falla y no llega tarde. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/cf7646f9-a4f8-46b7-9a5e-a4a861b955da.jpg",imagenCredito:"Foto: Bru-nO / Pixabay",id:"dev-2026-11-27",planId:"plan-2026-11"},{dia:28,tematica:"La renovación espiritual",at:"Zacarías 4:6",nt:"Hechos 1:4-8; Romanos 8:11",alabanza:{titulo:"Aviva tu obra",nota:"Inspirado en Habacuc 3:2, para pedir que el Espíritu renueve lo que se ha secado."},reflexion:`Zacarías recibe la respuesta para un pueblo cansado de reconstruir con recursos escasos: no con ejército, ni con fuerza, sino con mi Espíritu. No es que el trabajo humano no importe; es que sin el Espíritu no hay obra que permanezca.

Jesús dijo a sus discípulos que esperaran en Jerusalén hasta recibir poder del Espíritu Santo antes de salir a testificar. Y Romanos dice que el mismo Espíritu que levantó a Jesús de los muertos vivificará nuestros cuerpos mortales. Si el Espíritu puede resucitar a un muerto, puede renovar tu interior cansado. La renovación espiritual no es una subida emocional de un fin de semana; es volver cada mañana al mismo pozo. Pide, espera, obedece y no confíes en tu propia fuerza.`,oracion:"Espíritu de vida, sopla sobre lo que en mí se ha secado. No quiero construir con mi sola fuerza. Renueva mi interior, dame poder para testificar y esperanza para los días difíciles. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/d59d1a19-921d-4eb7-a521-865722df9f40.jpg",imagenCredito:"Foto: Tama66 / Pixabay",id:"dev-2026-11-28",planId:"plan-2026-11"},{dia:29,tematica:"El Mesías justo y misericordioso",at:"Miqueas 7:18-19",nt:"1 Juan 4:8; Romanos 5:8",alabanza:{titulo:"Jehová es mi pastor",nota:"Para descansar en el Pastor que busca hasta encontrar."},reflexion:`Miqueas termina su libro asombrado de que exista un Dios así: ¿quién es Dios semejante a ti, que perdona la maldad? No se goza en el castigo; se deleita en la misericordia. Echa nuestros pecados en las profundidades del mar, y el mar de Dios no devuelve lo que se le entrega.

Juan lo resume en tres palabras: Dios es amor. Y Pablo explica cuánto: Cristo murió por nosotros cuando todavía éramos pecadores. No esperó a que fuéramos amables para amarnos. La justicia y la misericordia del Mesías no compiten; se abrazan en la cruz. Si tu imagen de Dios es la de un juez con lupa, hoy el evangelio te ofrece otra: un Pastor que busca hasta encontrar.`,oracion:"Dios semejante a ti no hay. Gracias por echar al fondo del mar mis pecados cuando me arrepiento. Quita de mí la imagen de un Dios que solo vigila, y hazme conocer tu amor para poder transmitirlo. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/d3ddebd6-71e0-46e5-b319-a3ee18b2ab48.jpg",imagenCredito:"Foto: GuentherDillingen / Pixabay",id:"dev-2026-11-29",planId:"plan-2026-11"},{dia:30,tematica:"El fin de los tiempos y esperanza",at:"Sofonías 3:17-20",nt:"1 Tesalonicenses 4:16-18; Apocalipsis 21",alabanza:{titulo:"Cuando allá se pase lista",nota:"Un himno de esperanza sobre el día en que estaremos con el Señor."},reflexion:`Sofonías cierra con una promesa que el pueblo necesitaba oír: Dios está en medio de ti, se gozará en ti con alegría, se callará de amor, se regocijará sobre ti con cánticos. El final de la historia no es un dios retirado: es un Dios que festeja con los suyos.

Pablo dice a los tesalonicenses que los que murieron en Cristo resucitarán primero, y que luego estaremos juntos con el Señor para siempre; y añade la instrucción más tierna: consolaos unos a otros con estas palabras. Apocalipsis concluye con Dios habitando entre los hombres y enjugando toda lágrima. La esperanza del fin no nos saca del mundo: nos da consuelo para servir en él. Donde hay esperanza hay consuelo, donde hay consuelo hay comunidad, y donde hay comunidad la iglesia es un faro.`,oracion:"Señor, tú estás en medio de tu pueblo y te alegras sobre nosotros. Sostén mi esperanza hasta el día en que todo sea nuevo, y enséñame a consolar a otros con la misma esperanza que tú me das. En el nombre de Jesús, amén.",imagen:"https://api.whacka.app/storage/v1/object/public/app-images/e50ce212-7fd6-4d11-bc52-374270a7f206/5aeb1d89-2da1-48c3-be1b-2ded615b937a.jpg",imagenCredito:"Foto: suju-foto / Pixabay",id:"dev-2026-11-30",planId:"plan-2026-11"}],Xd=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],jD=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];function mi(i,c){return new Date(i,c,0).getDate()}function Ut(i){return i?`${Xd[i.month-1]} ${i.year}`:""}function Zd(){const i=new Date;return{year:i.getFullYear(),month:i.getMonth()+1,day:i.getDate()}}const Jg=i=>i.year*100+i.month;function dc(i){return[...i].sort((c,s)=>Jg(c)-Jg(s))}function mc(i){if(i.length===0)return null;const c=dc(i),{year:s,month:o}=Zd();return c.find(f=>f.year===s&&f.month===o)??c[c.length-1]}function zD(i,c,s){const o=new Date(i,c-1,s);return`${jD[o.getDay()]}, ${s} de ${Xd[c-1].toLowerCase()}`}const Bc="faro:leidos";function Ug(){try{const i=localStorage.getItem(Bc),c=i?JSON.parse(i):[];return Array.isArray(c)?c.filter(s=>typeof s=="string"):[]}catch{return[]}}function GD(i){try{localStorage.setItem(Bc,JSON.stringify(i))}catch{}}function hc(){const[i,c]=Q.useState(Ug);Q.useEffect(()=>{const o=f=>{f.key===Bc&&c(Ug
